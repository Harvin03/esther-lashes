<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esther Lashes | Panel de Control y POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0c0c;
            --surface: #161616;
            --surface-card: #1f1f1f;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f5f5f5;
            --text-muted: #a3a3a3;
            --border: #333333;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 40px;
        }

        header {
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: white;
            text-align: center;
            padding: 2.5rem 1rem 2rem 1rem;
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.15);
        }

        .logo-container {
            margin-bottom: 12px;
        }

        .logo-container img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }

        header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--gold-light);
            margin-bottom: 0.2rem;
            text-transform: uppercase;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            max-width: 650px;
            margin: 25px auto;
            padding: 0 15px;
            flex-wrap: wrap;
        }

        .nav-tabs button {
            flex: 1;
            min-width: 110px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .nav-tabs button.active {
            background: var(--gold);
            color: #000000;
            border-color: var(--gold);
            font-weight: 700;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-panel {
            background: var(--surface-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        h2 {
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold) 0%, #b89728 100%);
            color: #000000;
            border: none;
            padding: 13px;
            width: 100%;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
            transform: translateY(-1px);
        }

        .card-list {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-item {
            background: var(--surface-card);
            padding: 15px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .card-item:hover {
            border-color: #444;
        }

        .card-info h4 {
            margin: 0 0 4px 0;
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .card-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .badge {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .actions button {
            background: #2a2a2a;
            border: 1px solid #444;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .actions button:hover {
            background: #3a3a3a;
        }

        .price-tag {
            font-weight: 700;
            color: var(--gold);
            font-size: 1.05rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- Asegúrate de que el nombre del archivo de tu logo coincida con este src -->
            <img src="logo.jpeg" alt="Esther Lashes Logo">
        </div>
        <h1>Esther Lashes</h1>
        <p>Lashista & Estudio Profesional</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('servicios')">
            <span>💎</span> Servicios
        </button>
        <button class="tab-btn" onclick="switchTab('facturacion')">
            <span>🧾</span> Facturar
        </button>
        <button class="tab-btn" onclick="switchTab('historial')">
            <span>📊</span> Historial
        </button>
        <button class="tab-btn" onclick="switchTab('inventario')">
            <span>📦</span> Inventario
        </button>
    </div>

    <div class="container">
        
        <!-- SECCIÓN SERVICIOS -->
        <div id="servicios" class="tab-content active">
            <div class="card-panel">
                <h2>Gestión de Servicios</h2>
                <form id="serviceForm">
                    <input type="hidden" id="serviceId">
                    <div class="form-group">
                        <label>Nombre del Procedimiento</label>
                        <input type="text" id="nombreServicio" required placeholder="Ej: Volumen Ruso / Microblading">
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <select id="categoriaServicio">
                            <option value="Pestañas">Pestañas</option>
                            <option value="Cejas">Depilación y Diseño de Cejas</option>
                            <option value="Micropigmentacion">Micropigmentación</option>
                            <option value="Labios">Neutralización / Labios</option>
                            <option value="Cera">Depilación en Cera</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Precio ($)</label>
                        <input type="number" id="precioServicio" required placeholder="0.00">
                    </div>
                    <button type="submit" class="btn-primary" id="btnGuardarServicio">Registrar Servicio</button>
                </form>
            </div>

            <div class="card-list" id="listaServicios">
                <!-- Se cargan dinámicamente -->
            </div>
        </div>

        <!-- SECCIÓN FACTURACIÓN -->
        <div id="facturacion" class="tab-content">
            <div class="card-panel">
                <h2>Punto de Venta (POS)</h2>
                <form id="saleForm">
                    <div class="form-group">
                        <label>Nombre de la Clienta</label>
                        <input type="text" id="clientName" required placeholder="Nombre completo">
                    </div>
                    <div class="form-group">
                        <label>Seleccionar Servicio Realizado</label>
                        <select id="selectServicioVenta" required>
                            <!-- Se llena con los servicios -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Método de Pago</label>
                        <select id="metodoPago">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Transferencia">Transferencia Bancaria</option>
                            <option value="Tarjeta">Tarjeta de Crédito / Débito</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Emitir Factura y Cobrar</button>
                </form>
            </div>
        </div>

        <!-- SECCIÓN HISTORIAL DE VENTAS -->
        <div id="historial" class="tab-content">
            <div class="card-panel">
                <h2>Historial de Facturas y Ventas</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 0.5rem;">
                    Registro organizado de servicios cobrados por fecha, mes y año.
                </p>
            </div>
            <div class="card-list" id="listaHistorial">
                <!-- Se cargan dinámicamente -->
            </div>
        </div>

        <!-- SECCIÓN INVENTARIO -->
        <div id="inventario" class="tab-content">
            <div class="card-panel">
                <h2>Control de Insumos</h2>
                <form id="inventoryForm">
                    <div class="form-group">
                        <label>Nombre del Insumo</label>
                        <input type="text" id="nombreItem" required placeholder="Ej: Pestañas Seda 0.07 / Adhesivo">
                    </div>
                    <div class="form-group">
                        <label>Cantidad en Stock</label>
                        <input type="number" id="cantidadStock" required placeholder="0">
                    </div>
                    <div class="form-group">
                        <label>Unidad de Medida</label>
                        <input type="text" id="unidadMedida" required placeholder="Ej: cajas, unidades, ml">
                    </div>
                    <div class="form-group">
                        <label>Costo de Adquisición ($)</label>
                        <input type="number" id="precioCompra" required placeholder="0.00">
                    </div>
                    <button type="submit" class="btn-primary">Añadir Insumo</button>
                </form>
            </div>

            <div class="card-list" id="listaInventario">
                <!-- Se cargan dinámicamente -->
            </div>
        </div>

    </div>

    <script>
        const API_URL = '/api';

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
            if(tabId === 'servicios') cargarServicios();
            if(tabId === 'inventario') cargarInventario();
            if(tabId === 'historial') cargarHistorial();
        }

        async function cargarServicios() {
            try {
                const res = await fetch(`${API_URL}/services`);
                const servicios = await res.json();
                const contenedor = document.getElementById('listaServicios');
                const selectVenta = document.getElementById('selectServicioVenta');
                
                contenedor.innerHTML = '';
                selectVenta.innerHTML = '';

                servicios.forEach(s => {
                    contenedor.innerHTML += `
                        <div class="card-item">
                            <div class="card-info">
                                <h4>${s.nombre}</h4>
                                <p><span class="badge">${s.categoria}</span></p>
                            </div>
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <span class="price-tag">$${s.precio}</span>
                                <div class="actions">
                                    <button onclick="eliminarServicio('${s._id}')" title="Eliminar">🗑️</button>
                                </div>
                            </div>
                        </div>
                    `;
                    selectVenta.innerHTML += `<option value="${s._id}" data-precio="${s.precio}" data-nombre="${s.nombre}">${s.nombre} — $${s.precio}</option>`;
                });
            } catch (err) {
                console.error("Error cargando servicios", err);
            }
        }

        document.getElementById('serviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                nombre: document.getElementById('nombreServicio').value,
                categoria: document.getElementById('categoriaServicio').value,
                precio: document.getElementById('precioServicio').value
            };

            await fetch(`${API_URL}/services`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            document.getElementById('serviceForm').reset();
            cargarServicios();
        });

        async function eliminarServicio(id) {
            if(confirm('¿Eliminar este servicio del catálogo?')) {
                await fetch(`${API_URL}/services/${id}`, { method: 'DELETE' });
                cargarServicios();
            }
        }

        document.getElementById('saleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const select = document.getElementById('selectServicioVenta');
            if(!select.options.length) {
                alert('Primero debes registrar al menos un servicio en la pestaña Servicios.');
                return;
            }
            const option = select.options[select.selectedIndex];
            
            const saleData = {
                clientName: document.getElementById('clientName').value,
                services: [{
                    serviceId: option.value,
                    nombreServicio: option.getAttribute('data-nombre'),
                    precioUnitario: parseFloat(option.getAttribute('data-precio'))
                }],
                metodoPago: document.getElementById('metodoPago').value
            };

            const res = await fetch(`${API_URL}/sales`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(saleData)
            });

            if(res.ok) {
                alert('✨ ¡Factura generada y registrada con éxito!');
                document.getElementById('saleForm').reset();
            } else {
                alert('Error al procesar la factura');
            }
        });

        async function cargarHistorial() {
            try {
                const res = await fetch(`${API_URL}/sales`);
                const ventas = await res.json();
                const contenedor = document.getElementById('listaHistorial');
                contenedor.innerHTML = '';

                if (ventas.length === 0) {
                    contenedor.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 20px;">No hay facturas registradas todavía.</p>`;
                    return;
                }

                ventas.forEach(v => {
                    const fechaObj = new Date(v.createdAt || Date.now());
                    const fechaFormateada = fechaObj.toLocaleDateString('es-ES', { 
                        day: '2-digit', 
                        month: 'long', 
                        year: 'numeric' 
                    });
                    const horaFormateada = fechaObj.toLocaleTimeString('es-ES', { 
                        hour: '2-digit', 
                        minute: '2-digit' 
                    });

                    const totalVenta = v.services.reduce((acc, s) => acc + s.precioUnitario, 0);
                    const detalleServicios = v.services.map(s => s.nombreServicio).join(', ');

                    contenedor.innerHTML += `
                        <div class="card-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                            <div style="display: flex; justify-content: space-between; width: 100%;">
                                <h4 style="color: var(--gold);">${v.clientName}</h4>
                                <span class="price-tag">$${totalVenta.toFixed(2)}</span>
                            </div>
                            <p style="font-size: 0.9rem;"><b>Servicio(s):</b> ${detalleServicios}</p>
                            <div style="display: flex; justify-content: space-between; width: 100%; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 6px; margin-top: 4px;">
                                <span>📅 ${fechaFormateada} — ⏰ ${horaFormateada}</span>
                                <span class="badge">Pago: ${v.metodoPago}</span>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error cargando historial", err);
            }
        }

        async function cargarInventario() {
            try {
                const res = await fetch(`${API_URL}/inventory`);
                const items = await res.json();
                const contenedor = document.getElementById('listaInventario');
                contenedor.innerHTML = '';

                items.forEach(i => {
                    contenedor.innerHTML += `
                        <div class="card-item">
                            <div class="card-info">
                                <h4>${i.nombreItem}</h4>
                                <p>Stock: <b>${i.cantidadStock} ${i.unidadMedida}</b></p>
                            </div>
                            <span class="price-tag" style="font-size: 0.95rem;">Costo: $${i.precioCompra}</span>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error cargando inventario", err);
            }
        }

        document.getElementById('inventoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const itemData = {
                nombreItem: document.getElementById('nombreItem').value,
                cantidadStock: document.getElementById('cantidadStock').value,
                unidadMedida: document.getElementById('unidadMedida').value,
                precioCompra: document.getElementById('precioCompra').value
            };

            await fetch(`${API_URL}/inventory`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(itemData)
            });

            document.getElementById('inventoryForm').reset();
            cargarInventario();
        });

        cargarServicios();
    </script>
</body>
</html>
